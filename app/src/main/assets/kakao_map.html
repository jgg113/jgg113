<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
  #map, #rv { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #rv { display: none; z-index: 5; }
  #msg { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 7; display: none;
         background: rgba(0,0,0,.75); color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
  .bubble { position: relative; bottom: 8px; background: #1F4FA3; color: #fff; padding: 4px 8px; border-radius: 14px;
            font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .bubble:after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px;
                  border: 6px solid transparent; border-top-color: #1F4FA3; border-bottom: 0; }
  .bubble small { font-weight: 400; margin-left: 3px; opacity: .9; }
  .bubble.sel { background: #C0392B; z-index: 3; }
  .bubble.sel:after { border-top-color: #C0392B; }
  .poi { position: relative; bottom: 4px; background: #fff; color: #222; border: 1px solid #0E7C66; border-radius: 10px;
         padding: 2px 6px; font-size: 11px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .me { width: 14px; height: 14px; border-radius: 50%; background: #2E7DF6; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(46,125,246,.35); }
</style>
<script>window.sdkLoadError = false;</script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=__APPKEY__&libraries=services,clusterer&autoload=false" onerror="window.sdkLoadError = true"></script>
</head>
<body>
<div id="map"></div>
<div id="rv"></div>
<div id="msg"></div>
<script>
  // 안드로이드 → app.xxx() 호출, 지도 → Android.xxx() 콜백. 키·도메인 문제면 SDK 가 아예 안 뜨므로 메시지로 알린다.
  var bridge = window.Android || { onReady: function () {}, onMessage: function () {}, onMarkerClick: function () {},
    onGeocoded: function () {}, onNearby: function () {}, onRegion: function () {}, onLocated: function () {} };
  var app = { ready: false };
  var failed = false;

  function showMsg(text) {
    var el = document.getElementById('msg');
    el.textContent = text || '';
    el.style.display = text ? 'block' : 'none';
  }

  function sdkFailed() {
    if (failed || app.ready) return;
    failed = true;
    showMsg('카카오 지도를 불러오지 못했습니다. 설정의 카카오 JavaScript 키와, 카카오 개발자 사이트에 http://localhost 도메인을 등록했는지 확인하세요.');
    bridge.onMessage('SDK_FAILED');
  }

  setTimeout(function () { if (!app.ready) sdkFailed(); }, 10000);

  function init() {
    var M = kakao.maps;
    var map = new M.Map(document.getElementById('map'), { center: new M.LatLng(37.5665, 126.9780), level: 8 });
    var geocoder = new M.services.Geocoder();
    var places = new M.services.Places();
    var clusterer = null;
    try {
      clusterer = new M.MarkerClusterer({ map: map, averageCenter: true, minLevel: 7, gridSize: 50 });
    } catch (e) { clusterer = null; }

    var overlays = {};     // id → { overlay, el, pos }
    var selectedId = null;
    var generation = 0;
    var center = null;     // 상세 모드의 물건 위치
    var pois = [];
    var me = null;
    var roadview = null;

    function bubble(item) {
      var el = document.createElement('div');
      el.className = 'bubble';
      el.appendChild(document.createTextNode(item.label || '-'));
      if (item.sub) {
        var s = document.createElement('small');
        s.textContent = item.sub;
        el.appendChild(s);
      }
      return el;
    }

    var useCluster = false;

    function place(item, pos, clickable) {
      var el = bubble(item);
      var overlay = new M.CustomOverlay({ position: pos, content: el, yAnchor: 1, clickable: true });
      if (clickable) {
        el.addEventListener('click', function () { select(item.id); bridge.onMarkerClick(item.id); });
      }
      overlays[item.id] = { overlay: overlay, el: el, pos: pos };
      var added = false;
      if (clusterer && useCluster) {
        try { clusterer.addMarker(overlay); added = true; } catch (e) { added = false; }
      }
      if (!added) overlay.setMap(map);
    }

    function clearItems() {
      if (clusterer) { try { clusterer.clear(); } catch (e) {} }
      for (var id in overlays) overlays[id].overlay.setMap(null);
      overlays = {};
      selectedId = null;
    }

    function select(id) {
      if (selectedId && overlays[selectedId]) overlays[selectedId].el.className = 'bubble';
      selectedId = id;
      if (overlays[id]) overlays[id].el.className = 'bubble sel';
    }

    // 주소 후보를 차례로 시도한다. 지번 주소가 실패하면 읍면동 중심으로 근사한다.
    function geocode(queries, done) {
      var list = (queries || []).slice();
      (function next() {
        if (!list.length) { done(null); return; }
        var q = list.shift();
        geocoder.addressSearch(q, function (result, status) {
          if (status === M.services.Status.OK && result.length) {
            done({ lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
          } else {
            next();
          }
        });
      })();
    }

    function fit(points) {
      if (!points.length) return;
      if (points.length === 1) { map.setCenter(points[0]); map.setLevel(4); return; }
      var bounds = new M.LatLngBounds();
      points.forEach(function (p) { bounds.extend(p); });
      map.setBounds(bounds);
    }

    app.setItems = function (items, shouldFit) {
      generation++;
      var gen = generation;
      clearItems();
      // 물건이 아주 많을 때만 묶어서 보여준다. 적을 때는 가격 말풍선을 모두 그대로 띄운다.
      useCluster = items.length > 150;
      var points = [];
      var pending = [];
      items.forEach(function (item) {
        if (typeof item.lat === 'number' && typeof item.lng === 'number') {
          var pos = new M.LatLng(item.lat, item.lng);
          place(item, pos, true);
          points.push(pos);
        } else {
          pending.push(item);
        }
      });
      if (shouldFit && points.length) fit(points);
      if (!pending.length) { bridge.onMessage('ITEMS_DONE'); return; }

      var cursor = 0, active = 0, total = pending.length, finished = 0;
      showMsg('위치를 찾는 중… 0/' + total);
      function pump() {
        while (active < 4 && cursor < pending.length) {
          (function (item) {
            active++;
            geocode(item.q, function (r) {
              active--;
              finished++;
              if (gen !== generation) return;
              if (r) {
                var pos = new M.LatLng(r.lat, r.lng);
                place(item, pos, true);
                points.push(pos);
                bridge.onGeocoded(item.gk, r.lat, r.lng);
              }
              showMsg(finished < total ? '위치를 찾는 중… ' + finished + '/' + total : '');
              if (finished === total) {
                if (shouldFit) fit(points);
                bridge.onMessage('ITEMS_DONE');
              } else {
                pump();
              }
            });
          })(pending[cursor++]);
        }
      }
      pump();
    };

    app.focus = function (id) {
      var o = overlays[id];
      if (!o) return;
      select(id);
      map.panTo(o.pos);
    };

    app.showMe = function (lat, lng, pan) {
      var pos = new M.LatLng(lat, lng);
      if (!me) {
        var el = document.createElement('div');
        el.className = 'me';
        me = new M.CustomOverlay({ position: pos, content: el, xAnchor: 0.5, yAnchor: 0.5, zIndex: 4 });
      }
      me.setPosition(pos);
      me.setMap(map);
      if (pan) { map.setLevel(6); map.panTo(pos); }
    };

    // 좌표가 속한 시도·시군구 (법정동 기준)
    app.regionOf = function (lat, lng) {
      geocoder.coord2RegionCode(lng, lat, function (result, status) {
        if (status !== M.services.Status.OK) { bridge.onMessage('REGION_FAILED'); return; }
        var r = result.filter(function (x) { return x.region_type === 'B'; })[0] || result[0];
        bridge.onRegion(r.region_1depth_name || '', r.region_2depth_name || '');
      });
    };

    // 상세 화면: 물건 하나를 찍고 주변 시설·로드뷰를 보여준다.
    app.showProperty = function (item) {
      clearItems();
      useCluster = false;
      function located(lat, lng) {
        center = new M.LatLng(lat, lng);
        place(item, center, false);
        map.setLevel(4);
        map.setCenter(center);
        bridge.onLocated(lat, lng);
      }
      if (typeof item.lat === 'number' && typeof item.lng === 'number') {
        located(item.lat, item.lng);
        return;
      }
      showMsg('위치를 찾는 중…');
      geocode(item.q, function (r) {
        showMsg('');
        if (!r) { showMsg('주소로 위치를 찾지 못했습니다.'); bridge.onMessage('GEOCODE_FAILED'); return; }
        bridge.onGeocoded(item.gk, r.lat, r.lng);
        located(r.lat, r.lng);
      });
    };

    function clearPois() {
      pois.forEach(function (p) { p.setMap(null); });
      pois = [];
    }

    app.nearby = function (code) {
      clearPois();
      if (!center) return;
      if (!code) { map.setLevel(4); map.setCenter(center); bridge.onNearby('[]'); return; }
      places.categorySearch(code, function (data, status) {
        var list = [];
        var points = [center];
        if (status === M.services.Status.OK) {
          data.slice(0, 15).forEach(function (d) {
            var pos = new M.LatLng(parseFloat(d.y), parseFloat(d.x));
            var el = document.createElement('div');
            el.className = 'poi';
            el.textContent = d.place_name;
            var ov = new M.CustomOverlay({ position: pos, content: el, yAnchor: 1, zIndex: 2 });
            ov.setMap(map);
            pois.push(ov);
            points.push(pos);
            list.push({ name: d.place_name, distance: parseInt(d.distance || '0', 10), category: d.category_name || '',
                        url: d.place_url || '' });
          });
        }
        fit(points.slice(0, 6));
        bridge.onNearby(JSON.stringify(list));
      }, { location: center, radius: 2000, sort: M.services.SortBy.DISTANCE });
    };

    app.openRoadview = function () {
      if (!center) return;
      new M.RoadviewClient().getNearestPanoId(center, 100, function (panoId) {
        if (!panoId) { bridge.onMessage('NO_ROADVIEW'); return; }
        var box = document.getElementById('rv');
        box.style.display = 'block';
        if (!roadview) roadview = new M.Roadview(box);
        roadview.setPanoId(panoId, center);
        setTimeout(function () { roadview.relayout(); }, 50);
        bridge.onMessage('ROADVIEW_OPEN');
      });
    };

    app.closeRoadview = function () {
      document.getElementById('rv').style.display = 'none';
      map.relayout();
    };

    app.relayout = function () {
      map.relayout();
      if (roadview) roadview.relayout();
    };

    app.ready = true;
    showMsg('');
    bridge.onReady();
  }

  if (window.sdkLoadError || typeof kakao === 'undefined' || !kakao.maps || !kakao.maps.load) {
    sdkFailed();
  } else {
    kakao.maps.load(init);
  }
</script>
</body>
</html>
