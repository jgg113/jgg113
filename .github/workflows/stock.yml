name: 주식노트 APK

on:
  push:
    branches: ["**"]
    paths: ["stock/**", "!stock/**.md", ".github/workflows/stock.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: stock

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: stock

      # 같은 서명 키로 계속 빌드해야 휴대폰에서 업데이트(덮어쓰기) 설치가 된다.
      # 저장소 Secrets 에 KEYSTORE_BASE64 가 있으면 그 키를 쓰고, 없으면 처음 만든 키를 캐시에 두고 재사용한다.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.stocknote-signing
          key: stocknote-signing-key-v1

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            store="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$store"
            pass="$KEYSTORE_PASSWORD"
            alias="${KEY_ALIAS:-gongmae}"
          else
            mkdir -p "$HOME/.stocknote-signing"
            store="$HOME/.stocknote-signing/release.jks"
            pass="stocknote-ci-key"
            alias="stocknote"
            if [ ! -f "$store" ]; then
              keytool -genkeypair -keystore "$store" -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$pass" -keypass "$pass" -dname "CN=Stock Note, C=KR"
            fi
          fi
          {
            echo "SIGNING_STORE_FILE=$store"
            echo "SIGNING_STORE_PASSWORD=$pass"
            echo "SIGNING_KEY_ALIAS=$alias"
            echo "SIGNING_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/stocknote-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk out/stocknote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stocknote-apk
          path: stock/out/*.apk

      # 공매비교의 'latest' 링크를 건드리지 않도록 최신(latest) 표시는 하지 않는다.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stock-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: 주식노트 1.0.${{ github.run_number }}
          make_latest: "false"
          files: stock/out/stocknote-1.0.${{ github.run_number }}.apk
          body: |
            주식노트 안드로이드 앱입니다. 아래 Assets 의 .apk 파일을 휴대폰에서 눌러 내려받은 뒤 설치하세요.
            처음 설치할 때는 "출처를 알 수 없는 앱 설치"를 허용해야 합니다.

            브랜치: ${{ github.ref_name }}
            커밋: ${{ github.sha }}

      # 늘 같은 주소로 최신 APK 를 받을 수 있게 고정 릴리스의 파일을 바꿔 끼운다.
      - name: Update fixed download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stocknote-latest
          target_commitish: ${{ github.sha }}
          name: 주식노트 (항상 최신)
          make_latest: "false"
          overwrite_files: true
          files: stock/out/stocknote.apk
          body: |
            이 릴리스의 stocknote.apk 는 빌드할 때마다 최신 파일로 바뀝니다.
            바로 받기: https://github.com/${{ github.repository }}/releases/download/stocknote-latest/stocknote.apk
